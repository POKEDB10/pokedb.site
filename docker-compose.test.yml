services:
  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z@sha256:0dc8ea1121d1d86d64d1f2a35368a49c693a20a442e32a68868da6c2c2e0b572
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: test
      PORT: 5050
      STORE: sqlite
      SQLITE_DB_PATH: /app/data/pokedb.sqlite
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET_NAME: pokedb-drops
      R2_BUCKET_BACKUPS: pokedb-backups-staging
      R2_ACCOUNT_ID: minio
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadminpassword
      TRUST_PROXY: loopback,uniquelocal
    depends_on:
      - minio
    volumes:
      - test-db-data:/app/data

volumes:
  minio-data:
  test-db-data:

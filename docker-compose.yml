version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}@redis:6379
      - BASE_URL=http://localhost:5050
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in your environment}
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:

<!DOCTYPE html>
<html lang="en" data-theme="oled-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Base64, Hex &amp; URL Codec — pokedb.site tools</title>
<meta name="description" content="Offline encoder and decoder for Base64, Base64URL, Hex, URL encoding, and binary.">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tools/shared/theme.css">
<script src="/tools/shared/theme-switcher.js?v=3"></script>
<script src="/tools/shared/state-url.js"></script>
<style>
  .codec-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: .85rem; }
  @media (max-width: 768px) { .codec-grid { grid-template-columns: 1fr; } }
  .editor-box { width: 100%; height: 350px; font-family: 'IBM Plex Mono', monospace; font-size: .85rem; padding: .75rem; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); resize: vertical; margin-top: .4rem; }
  .controls-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .format-select-wrap { display: flex; align-items: center; gap: .5rem; }
  @media (max-width: 560px) { .format-select-wrap { width: 100%; } .format-select-wrap select { max-width: none !important; flex: 1; } }
</style>
</head>
<body class="tool-page">

<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-nav">
  <a class="logo" href="/" data-nav="main">root<span>@</span>pokedb</a>
  <nav class="nav-links" aria-label="Tools navigation">
    <a class="nav-link" href="https://tools.pokedb.site/" data-nav="tools">Tools hub</a>
    <a class="nav-link" href="https://tinyurl.pokedb.site/" data-nav="tinyurl">TinyURL</a>
    <a class="nav-link" href="https://qr.pokedb.site/" data-nav="qr">QR studio</a>
    <a class="nav-link" href="https://drop.pokedb.site/" data-nav="drop">Drop</a>
    <a class="nav-link" href="https://pokedb.site/tools/lan/" data-nav="lan">LAN</a>
    <a class="nav-link" href="https://paste.pokedb.site/" data-nav="paste">Pastebin</a>
    <a class="nav-link" href="https://health.pokedb.site/" data-nav="health">Health</a>
  </nav>
  <div class="theme-switcher">
    <span class="theme-swatch" id="theme-swatch"></span>
    <select id="theme-select" aria-label="Color theme"></select>
  </div>
</header>

<main id="main" class="tool-shell">
  <div class="tool-head">
    <div>
      <h1>Base64, Hex &amp; URL Codec</h1>
      <p class="tool-sub">Two-way encoding and decoding for Base64, Base64URL, hex, URL, and binary bits.</p>
    </div>
    <span class="tool-quiet-meta">Local browser only · connect-src: none</span>
  </div>

  <div class="controls-row">
    <div class="format-select-wrap">
      <label for="format-select" class="mono">Encoding</label>
      <select id="format-select" class="mono" style="max-width:180px;">
        <option value="base64">Base64</option>
        <option value="base64url">Base64URL</option>
        <option value="hex">Hexadecimal</option>
        <option value="url">URL Encoding</option>
        <option value="binary">Binary Bits</option>
      </select>
    </div>
    <button class="btn btn-solid" id="btn-encode" type="button">Encode →</button>
    <button class="btn btn-solid" id="btn-decode" type="button">← Decode</button>
    <button class="btn" id="btn-swap" type="button">Swap</button>
    <button class="btn" id="btn-copy" type="button">Copy result</button>
    <button class="btn" id="btn-clear" type="button">Clear</button>
    <button class="btn" id="btn-share" type="button">Share state</button>
  </div>

  <div class="codec-grid">
    <div>
      <label for="input-text" class="mono">Plain / source text</label>
      <textarea id="input-text" class="editor-box" placeholder="Type or paste plain text here..." spellcheck="false"></textarea>
    </div>
    <div>
      <label for="output-text" class="mono">Encoded / target representation</label>
      <textarea id="output-text" class="editor-box" placeholder="Encoded output appears here..." spellcheck="false"></textarea>
    </div>
  </div>

  <div id="status-bar" class="mono" style="margin-top:.75rem; font-size:.8rem; color:var(--muted);">Ready</div>
</main>

<script src="./app.js" defer></script>

</body>
</html>

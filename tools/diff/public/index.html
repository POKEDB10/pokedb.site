<!DOCTYPE html>
<html lang="en" data-theme="oled-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Text Diff Studio — pokedb.site tools</title>
<meta name="description" content="Offline line-by-line text and code difference viewer.">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tools/shared/theme.css">
<script src="/tools/shared/theme-switcher.js?v=3"></script>
<script src="/tools/shared/state-url.js"></script>
<style>
  .diff-inputs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: .85rem; }
  @media (max-width: 768px) { .diff-inputs { grid-template-columns: 1fr; } }
  .editor-box { width: 100%; height: 240px; font-family: 'IBM Plex Mono', monospace; font-size: .85rem; padding: .75rem; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); resize: vertical; margin-top: .4rem; }
  .diff-output { margin-top: 1.25rem; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow-x: auto; font-family: 'IBM Plex Mono', monospace; font-size: .82rem; }
  .diff-line { padding: .22rem .65rem; display: flex; gap: .75rem; border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  .diff-line.add { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .diff-line.del { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
  .diff-line.same { color: var(--text); }
  .diff-ln { width: 30px; text-align: right; color: var(--muted); user-select: none; flex-shrink: 0; }
</style>
</head>
<body class="tool-page">

<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-nav">
  <a class="logo" href="/" data-nav="main">root<span>@</span>pokedb</a>
  <nav class="nav-links" aria-label="Tools navigation">
    <a class="nav-link" href="https://tools.pokedb.site/" data-nav="tools">Tools hub</a>
    <a class="nav-link" href="https://tinyurl.pokedb.site/" data-nav="tinyurl">TinyURL</a>
    <a class="nav-link" href="https://qr.pokedb.site/" data-nav="qr">QR studio</a>
    <a class="nav-link" href="https://drop.pokedb.site/" data-nav="drop">Drop</a>
    <a class="nav-link" href="https://pokedb.site/tools/lan/" data-nav="lan">LAN</a>
    <a class="nav-link" href="https://paste.pokedb.site/" data-nav="paste">Pastebin</a>
    <a class="nav-link" href="https://health.pokedb.site/" data-nav="health">Health</a>
  </nav>
  <div class="theme-switcher">
    <span class="theme-swatch" id="theme-swatch"></span>
    <select id="theme-select" aria-label="Color theme"></select>
  </div>
</header>

<main id="main" class="tool-shell">
  <div class="tool-head">
    <div>
      <h1>Text Diff Studio</h1>
      <p class="tool-sub">Compare two text blocks line by line in pure browser JavaScript.</p>
    </div>
    <span class="tool-quiet-meta">Local browser only · connect-src: none</span>
  </div>

  <div style="display:flex; gap:.5rem; flex-wrap:wrap;">
    <button class="btn btn-solid" id="btn-compare" type="button">Compare</button>
    <button class="btn" id="btn-swap" type="button">Swap</button>
    <button class="btn" id="btn-clear" type="button">Clear</button>
    <button class="btn" id="btn-share" type="button">Share state</button>
  </div>

  <div class="diff-inputs">
    <div>
      <label for="text-old" class="mono">Original (old)</label>
      <textarea id="text-old" class="editor-box" placeholder="Original text..." spellcheck="false"></textarea>
    </div>
    <div>
      <label for="text-new" class="mono">Modified (new)</label>
      <textarea id="text-new" class="editor-box" placeholder="Modified text..." spellcheck="false"></textarea>
    </div>
  </div>

  <div id="diff-container" class="diff-output">
    <div style="padding:1rem; color:var(--muted);" class="mono">Run comparison to view unified differences.</div>
  </div>
</main>

<script src="./app.js" defer></script>

</body>
</html>

<!doctype html>
<html lang="en" data-theme="oled-black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shared file | Drop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/theme.css">
  <script src="/shared/theme-switcher.js"></script>
  <script src="/shared/utils.js"></script>
  <style>
    .viewer { width:min(100% - 2rem,880px); margin:clamp(2rem,7vw,5rem) auto; }
    .viewer-card { padding:clamp(1rem,4vw,2rem); border:1px solid var(--border); border-radius:14px; background:var(--surface); box-shadow:var(--shadow); }
    .file-head { display:flex; align-items:flex-start; gap:1rem; padding-bottom:1.25rem; border-bottom:1px solid var(--border); }
    .file-icon { display:grid; place-items:center; flex:none; width:3.25rem; height:3.25rem; border:1px solid var(--border); border-radius:10px; background:var(--bg); font-size:1.5rem; }
    .file-name { overflow-wrap:anywhere; font-size:clamp(1.05rem,3vw,1.5rem); } .file-meta { color:var(--muted); font:.75rem 'IBM Plex Mono',monospace; margin-top:.35rem; }
    .media-preview { display:none; margin-top:1.25rem; overflow:hidden; border:1px solid var(--border); border-radius:12px; background:#000; } .media-preview img,.media-preview video { display:block; width:100%; max-height:65vh; object-fit:contain; } .media-preview audio { display:block; width:100%; margin:2rem 0; }
    .actions { display:flex; flex-wrap:wrap; gap:.65rem; margin-top:1.25rem; } .actions .btn { flex:1 1 150px; }
    .modal { display:none; position:fixed; inset:0; z-index:50; place-items:center; padding:1rem; background:rgba(0,0,0,.7); } .modal-box { width:min(100%,360px); padding:1.25rem; border:1px solid var(--border); border-radius:12px; background:var(--surface); text-align:center; }
  </style>
</head>
<body>
  <header class="site-nav"><a class="logo" href="/" data-nav="main">root<span>@</span>pokedb</a><nav class="nav-links"><a class="nav-link" href="/tools/drop/" data-nav="drop">Drop</a><a class="nav-link" href="/tools/" data-nav="tools">Tools hub</a></nav><div class="theme-switcher"><span class="theme-swatch" id="theme-swatch"></span><select id="theme-select" aria-label="Choose a theme"><option value="oled-black">OLED — Pitch Indigo</option><option value="matrix">Matrix — Phosphor Green</option><option value="cyberpunk">Cyberpunk — Neon Cyan</option><option value="paper">Paper — Editorial Light</option></select></div></header>
  <main class="viewer"><article class="viewer-card"><span class="eyebrow">$ drop --shared-file</span><div class="file-head"><div class="file-icon" id="file-icon">📦</div><div><h1 class="file-name" id="file-title">Loading file…</h1><p class="file-meta"><span id="file-size">—</span> · <span id="file-downloads">— downloads</span> · <span id="file-expiry">Checking expiry…</span></p></div></div><div class="media-preview" id="media-preview"></div><div class="actions"><a class="btn btn-solid" id="download-btn" target="_blank" rel="noopener">Download file</a><button class="btn" id="qr-btn" type="button">Show QR</button><button class="btn" id="copy-btn" type="button">Copy link</button></div></article></main>
  <div class="modal" id="qr-modal" role="dialog" aria-modal="true" aria-label="Share QR code"><div class="modal-box"><span class="eyebrow">$ qr --share</span><div id="qr-box" style="display:inline-block;background:#fff;padding:.75rem;border-radius:8px"></div><button class="btn btn-solid" id="close-qr-btn" type="button" style="width:100%;margin-top:1rem">Close</button></div></div>
  <footer><div class="footer-inner"><span>© pokedb.site · drop storage gateway</span><span id="uptime">session uptime · 00:00:00</span></div></footer>
  <script src="/shared/site.js"></script><script src="./view.js"></script>
</body>
</html>

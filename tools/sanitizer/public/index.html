<!DOCTYPE html>
<html lang="en" data-theme="oled-black">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log &amp; Secret Sanitizer — pokedb.site tools</title>
<meta name="description" content="Offline client-side log sanitizer: automatically redacts IP addresses, emails, auth tokens, and home paths.">
<link rel="stylesheet" href="/fonts/fonts.css">
<link rel="stylesheet" href="/tools/shared/theme.css">
<script src="/tools/shared/theme-switcher.js?v=3"></script>
<script src="/tools/shared/state-url.js"></script>
<style>
  .tool-container { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
  .sanitizer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
  @media (max-width: 768px) { .sanitizer-grid { grid-template-columns: 1fr; } }
  .editor-box { width: 100%; height: 380px; font-family: var(--font-mono); font-size: 0.82rem; padding: 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); resize: vertical; }
  .badge-offline { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.2rem 0.6rem; border-radius: 4px; background: color-mix(in srgb, var(--success) 15%, transparent); border: 1px solid var(--success); color: var(--success); font-family: var(--font-mono); font-size: 0.75rem; }
  .stats-pill { padding: 0.2rem 0.6rem; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to main content</a>

<header class="site-nav">
  <a class="logo" href="/" data-nav="main">root<span>@</span>pokedb</a>
  <nav class="nav-links" aria-label="Tools navigation">
    <a class="nav-link" href="https://tools.pokedb.site/" data-nav="tools">Hub</a>
    <a class="nav-link" href="/tools/json">JSON</a>
    <a class="nav-link" href="/tools/jwt">JWT</a>
    <a class="nav-link" href="/tools/codec">Codec</a>
    <a class="nav-link" href="/tools/hash">Hash</a>
    <a class="nav-link" href="/tools/uuid">UUID</a>
    <a class="nav-link" href="/tools/cron">Cron</a>
    <a class="nav-link" href="/tools/diff">Diff</a>
    <a class="nav-link" href="/tools/minecraft">Minecraft</a>
    <a class="nav-link active" href="/tools/sanitizer">Sanitizer</a>
  </nav>
  <div class="theme-switcher">
    <span class="theme-swatch" id="theme-swatch"></span>
    <select id="theme-select" aria-label="Color theme">
      <option value="oled-black">OLED</option>
      <option value="paper">Paper</option>
      <option value="matrix">Matrix</option>
      <option value="cyberpunk">Cyberpunk</option>
      <option value="synthwave">Synthwave</option>
      <option value="nordic-ice">Nordic</option>
      <option value="dracula-neon">Dracula</option>
      <option value="gruvbox-retro">Gruvbox</option>
      <option value="emerald-forest">Emerald</option>
      <option value="sunset-amber">Sunset</option>
      <option value="solarized-gold">Solarized</option>
      <option value="tokyo-neon">Tokyo</option>
    </select>
  </div>
</header>

<main id="main" class="tool-container">
  <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
    <div>
      <span class="eyebrow">$ redact --logs</span>
      <h1 style="font-size:1.5rem; margin:0.25rem 0;">Client-Side Log &amp; Secret Sanitizer</h1>
    </div>
    <span class="badge-offline">● 100% Client-Side · connect-src: 'none'</span>
  </div>

  <div style="display:flex; gap:0.5rem; align-items:center; margin-top:1rem; flex-wrap:wrap;">
    <button class="btn btn-solid" id="btn-sanitize">Sanitize Now</button>
    <button class="btn" id="btn-copy">Copy Sanitized</button>
    <button class="btn" id="btn-clear">Clear</button>
    <button class="btn" id="btn-sample">Load Sample Log</button>
    <button class="btn" id="btn-share">Share State</button>
  </div>

  <div style="display:flex; gap:0.75rem; flex-wrap:wrap; margin-top:0.75rem;">
    <span class="stats-pill" id="stat-ips">IPs Redacted: 0</span>
    <span class="stats-pill" id="stat-emails">Emails Redacted: 0</span>
    <span class="stats-pill" id="stat-tokens">Tokens/Keys Redacted: 0</span>
    <span class="stats-pill" id="stat-paths">Paths Redacted: 0</span>
  </div>

  <div class="sanitizer-grid">
    <div>
      <label for="raw-input" class="mono">Raw Log Input</label>
      <textarea id="raw-input" class="editor-box" placeholder="Paste server logs, stack traces, or configuration outputs here..." spellcheck="false"></textarea>
    </div>
    <div>
      <label for="sanitized-output" class="mono">Sanitized Output (Safe to Share)</label>
      <textarea id="sanitized-output" class="editor-box" readonly placeholder="Sanitized logs will appear here..." spellcheck="false"></textarea>
    </div>
  </div>
</main>

<script src="./app.js" defer></script>

</body>
</html>
